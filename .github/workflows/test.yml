name: Isolated tests

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Run tests and measurements with private configuration
        run: python scripts/test_isolated.py --measure --output "${{ runner.temp }}/bettergit-validation"
      - name: Explain validation results
        if: always()
        run: python scripts/validation_report.py --input "${{ runner.temp }}/bettergit-validation" --github-summary
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bettergit-validation-${{ matrix.os }}-python-${{ matrix.python }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/bettergit-validation/*.json
            ${{ runner.temp }}/bettergit-validation/*.log
            ${{ runner.temp }}/bettergit-validation/report.md
